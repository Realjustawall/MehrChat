name: Windows GUI diagnostics
on:
  pull_request:
    paths:
      - main.py
      - mehrchat/ui.py
      - mehrchat/smoke.py
      - scripts/build.py
      - scripts/native_gui_smoke.py
      - .github/workflows/native-diagnostics.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-gui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-gui:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3 kivy_deps.sdl2 kivy_deps.angle kivy_deps.glew
      - name: Build and exercise windowed executable
        shell: bash
        run: |
          mkdir -p reports
          KIVY_GL_BACKEND=angle_sdl2 python scripts/build.py client > reports/build-client.txt 2>&1
          python scripts/native_gui_smoke.py > reports/compiled-gui-test.txt 2>&1
          python scripts/native_gui_smoke.py --language en > reports/compiled-gui-en-test.txt 2>&1
      - name: Collect native Kivy logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports/kivy | Out-Null
          Copy-Item "$env:USERPROFILE/.kivy/logs/*" reports/kivy -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-gui-diagnostics
          path: reports/
