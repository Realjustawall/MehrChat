name: Publish verified official release
on:
  push:
    branches: [main, fix/release-artifact-selection]
permissions:
  contents: read
  actions: read
concurrency:
  group: official-release
  cancel-in-progress: false
jobs:
  publish:
    if: contains(github.event.head_commit.message, 'Signed-APK-Blob:')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a successful exact-tree build before publication
        id: verified
        uses: actions/github-script@v7
        with:
          script: |
            const trigger = (await github.rest.repos.getCommit({...context.repo, ref:context.sha})).data;
            const selected = trigger.commit.message.match(/^Release-Commit: ([a-f0-9]{40})$/m);
            const releaseCommit = selected ? selected[1] : context.sha;
            if (releaseCommit !== context.sha) {
              const comparison = (await github.rest.repos.compareCommitsWithBasehead({...context.repo,basehead:releaseCommit+'...'+context.sha})).data;
              if (!['ahead','identical'].includes(comparison.status) || comparison.files.length !== 1 || comparison.files[0].filename !== '.github/workflows/official-release.yml' || comparison.files[0].status !== 'modified') throw new Error('Only the publisher workflow may differ from the verified release commit');
            }
            const commit = (await github.rest.repos.getCommit({...context.repo, ref:releaseCommit})).data;
            core.setOutput('release',releaseCommit);
            if (commit.parents.length !== 2) throw new Error('Release must use a verified two-parent PR merge');
            const source = commit.parents[1].sha;
            const tested = (await github.rest.repos.getCommit({...context.repo, ref:source})).data;
            if (tested.commit.tree.sha !== commit.commit.tree.sha) throw new Error('Merged tree differs from tested source');
            const runs = (await github.rest.actions.listWorkflowRunsForRepo({...context.repo, head_sha:source, event:'pull_request', status:'success', per_page:100})).data.workflow_runs;
            const run = runs.find(r=>r.path === '.github/workflows/build.yml' && r.conclusion === 'success');
            if (!run) throw new Error('No passing native/Android build exists for the exact source');
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...context.repo, run_id:run.id, per_page:100});
            for (const name of ['native (ubuntu-24.04)','native (windows-2022)','android (arm64-v8a)','android (x86_64)']) {
              if (!jobs.some(j=>j.name === name && j.conclusion === 'success')) throw new Error('Missing successful job: '+name);
            }
            const message = commit.commit.message;
            for (const [label,key,len] of [['Signed-APK-Blob','blob',40],['Signed-APK-SHA256','signed',64],['Unsigned-APK-SHA256','unsigned',64],['Android-Cert-SHA256','certificate',64]]) {
              const match = message.match(new RegExp('^'+label+': ([a-f0-9]{'+len+'})$', 'm'));
              if (!match) throw new Error('Missing validated signing metadata: '+label);
              core.setOutput(key,match[1]);
            }
            const fs = require('fs');
            const version = fs.readFileSync('mehrchat/__init__.py','utf8').match(/__version__ = "(\d+\.\d+\.\d+)"/)[1];
            core.setOutput('version',version);
            core.setOutput('run',String(run.id));
            core.setOutput('source',source);
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{...context.repo,run_id:run.id,per_page:100});
            const latest = new Map();
            for (const artifact of artifacts) {
              if (artifact.expired) continue;
              const previous = latest.get(artifact.name);
              if (!previous || Date.parse(artifact.created_at) > Date.parse(previous.created_at)) latest.set(artifact.name,artifact);
            }
            for (const name of ['native-reports-Windows','native-reports-Linux','android-reports-x86_64','MehrChat-Windows-native','MehrChat-Linux-native','MehrChat-Android-arm64-v8a']) {
              if (!latest.has(name)) throw new Error('Missing verified artifact: '+name);
            }
            core.setOutput('artifacts',JSON.stringify([...latest.values()].map(a=>({id:a.id,name:a.name}))));
      - name: Use exact verified release source
        run: git checkout --detach '${{ steps.verified.outputs.release }}'
      - name: Download exact selected artifact IDs
        uses: actions/github-script@v7
        env:
          SELECTED_ARTIFACTS: ${{ steps.verified.outputs.artifacts }}
        with:
          script: |
            const fs = require('fs');
            const {execFileSync} = require('child_process');
            for (const artifact of JSON.parse(process.env.SELECTED_ARTIFACTS)) {
              if (!/^[a-zA-Z0-9_.-]+$/.test(artifact.name)) throw new Error('Invalid artifact name');
              const archive = await github.rest.actions.downloadArtifact({...context.repo,artifact_id:artifact.id,archive_format:'zip'});
              const file = 'artifact-'+artifact.id+'.zip';
              fs.writeFileSync(file,Buffer.from(archive.data));
              const destination = 'verified-artifacts/'+artifact.name;
              fs.mkdirSync(destination,{recursive:true});
              execFileSync('unzip',['-q',file,'-d',destination]);
              fs.unlinkSync(file);
              core.info('Downloaded exact artifact '+artifact.name+' (#'+artifact.id+')');
            }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Retrieve externally signed APK (public binary only)
        uses: actions/github-script@v7
        env:
          SIGNED_BLOB: ${{ steps.verified.outputs.blob }}
        with:
          script: |
            const fs = require('fs');
            const blob = (await github.rest.git.getBlob({...context.repo, file_sha:process.env.SIGNED_BLOB})).data;
            if (blob.encoding !== 'base64') throw new Error('Unexpected blob encoding');
            const manifest = JSON.parse(Buffer.from(blob.content,'base64').toString('utf8'));
            if (manifest.format !== 'MehrChat-signed-apk-v1' || !Array.isArray(manifest.parts) || manifest.parts.length < 1 || manifest.parts.length > 32) throw new Error('Invalid signed APK manifest');
            if (!Number.isSafeInteger(manifest.size) || manifest.size < 1 || manifest.size > 100*1024*1024) throw new Error('Invalid signed APK size');
            const buffers = [];
            for (const part of manifest.parts) {
              if (!/^[a-f0-9]{40}$/.test(part.sha) || !Number.isSafeInteger(part.size) || part.size < 1 || part.size > 8*1024*1024) throw new Error('Invalid signed APK part');
              const data = (await github.rest.git.getBlob({...context.repo,file_sha:part.sha})).data;
              if (data.encoding !== 'base64') throw new Error('Unexpected part encoding');
              const buffer = Buffer.from(data.content,'base64');
              if (buffer.length !== part.size) throw new Error('Incomplete signed APK part');
              buffers.push(buffer);
            }
            const signed = Buffer.concat(buffers);
            if (signed.length !== manifest.size || require('crypto').createHash('sha256').update(signed).digest('hex') !== manifest.sha256) throw new Error('Signed APK transfer digest mismatch');
            fs.writeFileSync('signed-release.apk',signed);
      - name: Verify signature, tested payload and package release assets
        env:
          RELEASE_VERSION: ${{ steps.verified.outputs.version }}
          SIGNED_APK_SHA256: ${{ steps.verified.outputs.signed }}
          UNSIGNED_APK_SHA256: ${{ steps.verified.outputs.unsigned }}
          ANDROID_CERT_SHA256: ${{ steps.verified.outputs.certificate }}
        run: python scripts/prepare_official_release.py
      - name: Publish complete official release
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.verified.outputs.version }}
          RELEASE_COMMIT: ${{ steps.verified.outputs.release }}
          TESTED_SOURCE: ${{ steps.verified.outputs.source }}
          TESTED_RUN: ${{ steps.verified.outputs.run }}
          ANDROID_CERT_SHA256: ${{ steps.verified.outputs.certificate }}
        with:
          script: |
            const fs = require('fs');
            const version = process.env.RELEASE_VERSION;
            const tag = 'v'+version;
            const releaseCommit = process.env.RELEASE_COMMIT;
            const body = `Secure Ubuntu installation with verified TLS/private-CA fallback, authenticated pre-login connection setup, dedicated Windows/Android builds and refreshed Persian desktop/mobile UI.\n\nInstallation and setup: see README.md in the source archive or repository.\n\nSource: ${releaseCommit}\nTested source (identical tree): ${process.env.TESTED_SOURCE}\nNative/Android validation: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.TESTED_RUN}\n\nAndroid release is non-debuggable and signed with the existing owner key. Certificate SHA-256: ${process.env.ANDROID_CERT_SHA256}\nWindows executables are not Authenticode-signed.\n\nAssets include Windows/Linux clients and relays, the signed Android arm64 APK, Ubuntu server source/installer, actual Windows/Android UI screenshots, test reports, English installation guide and SHA-256 checksums. No independent security audit is claimed.`;
            const existing = (await github.rest.repos.listReleases({...context.repo,per_page:100})).data.find(r=>r.tag_name === tag);
            if (existing && (!existing.draft || existing.target_commitish !== releaseCommit)) throw new Error('Refusing to replace an existing public or unrelated release');
            const release = existing ? {data:existing} : await github.rest.repos.createRelease({...context.repo,tag_name:tag,target_commitish:releaseCommit,name:'MehrChat '+version,body,draft:true,prerelease:false});
            const crypto = require('crypto');
            const uploaded = (await github.rest.repos.listReleaseAssets({...context.repo,release_id:release.data.id,per_page:100})).data;
            for (const name of fs.readdirSync('release-assets').sort()) {
              const data = fs.readFileSync('release-assets/'+name);
              const previous = uploaded.find(a=>a.name === name);
              if (previous) {
                const digest = 'sha256:'+crypto.createHash('sha256').update(data).digest('hex');
                if (previous.digest !== digest || previous.size !== data.length) throw new Error('Conflicting draft asset: '+name);
                continue;
              }
              await github.rest.repos.uploadReleaseAsset({...context.repo,release_id:release.data.id,name,data,headers:{'content-type':'application/octet-stream'}});
            }
            const published = await github.rest.repos.updateRelease({...context.repo,release_id:release.data.id,draft:false,prerelease:false,make_latest:'true'});
            await core.summary.addLink('Official release',published.data.html_url).write();
