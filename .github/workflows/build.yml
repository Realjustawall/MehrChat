name: Native builds and startup tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mehrchat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Windows graphics dependencies
        if: runner.os == 'Windows'
        run: python -m pip install kivy_deps.sdl2 kivy_deps.angle kivy_deps.glew
      - name: Test security and real networking
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee reports/tests.txt
      - name: Build native relay
        shell: bash
        run: python scripts/build.py server > reports/build-relay.txt 2>&1
      - name: Build native client
        shell: bash
        run: python scripts/build.py client > reports/build-client.txt 2>&1
      - name: Test compiled relay with real clients
        shell: bash
        run: python tests/binary_smoke.py > reports/compiled-relay-test.txt 2>&1
      - name: Test Linux graphical startup
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a python scripts/native_gui_smoke.py > reports/compiled-gui-test.txt 2>&1
      - name: Test Windows graphical startup
        if: runner.os == 'Windows'
        shell: bash
        run: python scripts/native_gui_smoke.py > reports/compiled-gui-test.txt 2>&1
      - name: Package verified executables
        run: python scripts/package_native.py
      - uses: actions/upload-artifact@v4
        with:
          name: MehrChat-${{ runner.os }}-native
          path: packages/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-reports-${{ runner.os }}
          path: reports/
  android:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64-v8a, x86_64]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc
          sudo docker image prune -af
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf automake libtool libtool-bin pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          python -m pip install buildozer Cython==0.29.37 setuptools
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android
      - name: Configure target
        run: |
          mkdir -p reports
          sed -i 's/android.archs = .*/android.archs = ${{ matrix.arch }}/' buildozer.spec
          printf '\n' >> buildozer.spec
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
            .buildozer/android/platform
          key: android-${{ matrix.arch }}-${{ hashFiles('buildozer.spec','requirements.txt','p4a-recipes/**') }}
      - name: Build installable test APK
        env:
          RUSTUP_HOME: /home/runner/.rustup
          CARGO_HOME: /home/runner/.cargo
        run: buildozer android debug > reports/build-android-debug.txt 2>&1
      - name: Build unsigned non-debuggable release APK
        if: matrix.arch == 'arm64-v8a'
        env:
          RUSTUP_HOME: /home/runner/.rustup
          CARGO_HOME: /home/runner/.cargo
        run: buildozer android release > reports/build-android-release.txt 2>&1
      - name: Verify APK contents, ABI and security settings
        shell: bash
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          TOOLS=$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          python scripts/verify_android.py bin/*debug.apk --arch '${{ matrix.arch }}' --build-tools "$TOOLS" > reports/apk-debug-verification.txt
          if [ '${{ matrix.arch }}' = 'arm64-v8a' ]; then
            python scripts/verify_android.py bin/*release-unsigned.apk --arch arm64-v8a --release --build-tools "$TOOLS" > reports/apk-release-verification.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: MehrChat-Android-${{ matrix.arch }}
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Enable KVM
        if: matrix.arch == 'x86_64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch Android app on emulator
        if: matrix.arch == 'x86_64'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android_startup_test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports-${{ matrix.arch }}
          path: reports/
