name: Native builds and startup tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  # A slow earlier Android build must not hold the corrected source in a queue.
  group: mehrchat-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Windows graphics dependencies
        if: runner.os == 'Windows'
        run: python -m pip install kivy_deps.sdl2==0.8.0 kivy_deps.angle==0.5.0 kivy_deps.glew==0.3.2
      - name: Test security and real networking
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee reports/tests.txt
      - name: Verify connection gate and dedicated profile privacy
        shell: bash
        run: |
          if [ '${{ runner.os }}' = 'Linux' ]; then
            xvfb-run -a python scripts/connection_gui_smoke.py > reports/connection-gui-test.txt 2>&1
          else
            KIVY_GL_BACKEND=angle_sdl2 python scripts/connection_gui_smoke.py > reports/connection-gui-test.txt 2>&1
          fi
      - name: Verify text bounds and compact/mobile layouts
        shell: bash
        run: |
          if [ '${{ runner.os }}' = 'Linux' ]; then
            xvfb-run -a python scripts/layout_gui_smoke.py > reports/layout-gui-test.txt 2>&1
          else
            KIVY_GL_BACKEND=angle_sdl2 python scripts/layout_gui_smoke.py > reports/layout-gui-test.txt 2>&1
          fi
      - name: Verify Persian English themes and safe media layout
        shell: bash
        run: |
          if [ '${{ runner.os }}' = 'Linux' ]; then
            xvfb-run -a python scripts/appearance_gui_smoke.py > reports/appearance-gui-test.txt 2>&1
          else
            KIVY_GL_BACKEND=angle_sdl2 python scripts/appearance_gui_smoke.py > reports/appearance-gui-test.txt 2>&1
          fi
      - name: Build native relay
        shell: bash
        run: python scripts/build.py server > reports/build-relay.txt 2>&1
      - name: Build native client
        shell: bash
        run: |
          if [ '${{ runner.os }}' = 'Linux' ]; then
            xvfb-run -a python scripts/build.py client > reports/build-client.txt 2>&1
          else
            KIVY_GL_BACKEND=angle_sdl2 python scripts/build.py client > reports/build-client.txt 2>&1
          fi
      - name: Verify packaged media OS sandbox
        shell: bash
        run: python scripts/verify_media_sandbox.py > reports/media-sandbox-test.txt 2>&1
      - name: Test compiled relay with real clients
        shell: bash
        run: python tests/binary_smoke.py > reports/compiled-relay-test.txt 2>&1
      - name: Test Linux graphical startup
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a python scripts/native_gui_smoke.py > reports/compiled-gui-test.txt 2>&1
      - name: Test Windows graphical startup
        if: runner.os == 'Windows'
        shell: bash
        run: python scripts/native_gui_smoke.py > reports/compiled-gui-test.txt 2>&1
      - name: Verify desktop installation and identity retention
        shell: bash
        run: |
          if [ '${{ runner.os }}' = 'Linux' ]; then
            xvfb-run -a python scripts/verify_client_install.py > reports/client-install-test.txt 2>&1
          else
            python scripts/verify_client_install.py > reports/client-install-test.txt 2>&1
          fi
      - name: Verify Ubuntu offline service installation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo bash deploy/install-ubuntu-offline.sh
          trap 'sudo systemctl disable --now mehr-relay' EXIT
          sudo systemctl is-active --quiet mehr-relay
          sudo -E "$(command -v python)" scripts/verify_installed_relay.py /var/lib/mehrchat > reports/installed-service-test.txt
          pin_before=$(sudo sha256sum /var/lib/mehrchat/relay-public.json)
          sudo bash deploy/install-ubuntu-offline.sh
          sudo -E "$(command -v python)" scripts/verify_installed_relay.py /var/lib/mehrchat > reports/installed-service-upgrade-test.txt
          test "$pin_before" = "$(sudo sha256sum /var/lib/mehrchat/relay-public.json)"
      - name: Verify Windows Server offline task installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            & ./deploy/install-windows-relay.ps1
            python scripts/verify_installed_relay.py "$env:ProgramData/MehrRelay" > reports/installed-service-test.txt
            if ($LASTEXITCODE -ne 0) { throw 'Installed Windows relay failed its protocol test' }
            $pinBefore=(Get-Content "$env:ProgramData/MehrRelay/relay-public.json" -Raw | ConvertFrom-Json).pin
            & ./deploy/install-windows-relay.ps1
            python scripts/verify_installed_relay.py "$env:ProgramData/MehrRelay" > reports/installed-service-upgrade-test.txt
            if ($LASTEXITCODE -ne 0) { throw 'Upgraded Windows relay failed its protocol test' }
            $pinAfter=(Get-Content "$env:ProgramData/MehrRelay/relay-public.json" -Raw | ConvertFrom-Json).pin
            if ($pinBefore -ne $pinAfter) { throw 'Relay upgrade changed the pinned server identity' }
          } finally {
            Stop-ScheduledTask -TaskName MehrChatRelay -ErrorAction SilentlyContinue
            Unregister-ScheduledTask -TaskName MehrChatRelay -Confirm:$false -ErrorAction SilentlyContinue
            Remove-NetFirewallRule -DisplayName 'MehrChat Relay TCP' -ErrorAction SilentlyContinue
          }
      - name: Verify interactive Ubuntu TLS installation and upgrade
        if: runner.os == 'Linux'
        shell: bash
        run: python scripts/verify_secure_ubuntu.py > reports/secure-ubuntu-installation.txt 2>&1
      - name: Package verified executables
        run: python scripts/package_native.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MehrChat-${{ runner.os }}-native
          path: packages/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-reports-${{ runner.os }}
          path: reports/
  android:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64-v8a, x86_64]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc
          sudo docker image prune -af
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf automake libtool libtool-bin libltdl-dev pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          python -m pip install buildozer==1.6.0 Cython==0.29.37 setuptools==84.0.0
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android
      - name: Configure target
        run: |
          mkdir -p reports
          sed -i 's/android.archs = .*/android.archs = ${{ matrix.arch }}/' buildozer.spec
          printf '\n' >> buildozer.spec
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Compute Android native dependency identity
        id: android-deps
        run: python scripts/android_cache_key.py >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: android-cache
        with:
          path: |
            ~/.buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
            .buildozer/android/platform
          key: android-${{ matrix.arch }}-${{ steps.android-deps.outputs.key }}
          restore-keys: android-${{ matrix.arch }}-
      - name: Invalidate incompatible cached distribution
        if: steps.android-cache.outputs.cache-hit != 'true'
        env:
          MEHRCHAT_BUILD_ARCH: ${{ matrix.arch }}
        run: |
          python - <<'PYTHON'
          import os, shutil
          from pathlib import Path
          arch = os.environ['MEHRCHAT_BUILD_ARCH']
          assert arch in ('arm64-v8a', 'x86_64')
          target = Path('.buildozer/android/platform') / ('build-' + arch) / 'dists/mehrchat'
          if target.exists():
              shutil.rmtree(target)
          print('Native distribution will be reassembled using current recipe checks.')
          PYTHON
      - name: Build installable test APK
        env:
          RUSTUP_HOME: /home/runner/.rustup
          CARGO_HOME: /home/runner/.cargo
        run: buildozer android debug > reports/build-android-debug.txt 2>&1
      - name: Build unsigned non-debuggable release APK
        if: matrix.arch == 'arm64-v8a'
        env:
          RUSTUP_HOME: /home/runner/.rustup
          CARGO_HOME: /home/runner/.cargo
        run: buildozer android release > reports/build-android-release.txt 2>&1
      - name: Verify APK contents, ABI and security settings
        shell: bash
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          TOOLS=$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          python scripts/verify_android.py bin/*debug.apk --arch '${{ matrix.arch }}' --build-tools "$TOOLS" > reports/apk-debug-verification.txt
          if [ '${{ matrix.arch }}' = 'arm64-v8a' ]; then
            python scripts/verify_android.py bin/*release-unsigned.apk --arch arm64-v8a --release --build-tools "$TOOLS" > reports/apk-release-verification.txt
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MehrChat-Android-${{ matrix.arch }}
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always() && steps.android-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
            .buildozer/android/platform
          key: ${{ steps.android-cache.outputs.cache-primary-key }}
      - name: Install CI network peer dependencies
        if: matrix.arch == 'x86_64'
        run: python -m pip install -r requirements.txt
      - name: Enable KVM
        if: matrix.arch == 'x86_64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch Android app on emulator
        if: matrix.arch == 'x86_64'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android_startup_test.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-reports-${{ matrix.arch }}
          path: reports/
  candidate:
    needs: [native, android]
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: MehrChat-*
          path: candidate
          merge-multiple: true
      - name: Create reviewable draft with verified binaries
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = `v0.7.0-rc1-ci.${context.runNumber}`;
            const commit = context.payload.pull_request?.head.sha || context.sha;
            const release = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, target_commitish: commit,
              name: `MehrChat 0.7.0-rc1 — CI ${context.runNumber}`,
              draft: true, prerelease: true,
              body: `Native Windows/Linux and Android candidate.\n\nSource: ${commit}\nValidation: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nRelease APKs are unsigned and require the owner's signing key. Debug APKs are for testing. This candidate has not received an independent security audit.`
            });
            for (const file of fs.readdirSync('candidate')) {
              const full = path.join('candidate', file);
              if (!fs.statSync(full).isFile()) continue;
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: release.data.id, name: file,
                data: fs.readFileSync(full),
                headers: {'content-type': 'application/octet-stream'}
              });
            }
            await core.summary.addLink('Validated draft candidate', release.data.html_url).write();
